name: arctic-sa
channels: [conda-forge]
dependencies:
  - python>=3.9
  - numpy
  - pandas
  - scipy>=1.7
  - scikit-learn
  - h5py
  - matplotlib
  - pyyaml
  - jupyter
  - pytest
  - pip
  - pip:
      - -e .
# ATS (with PFLOTRAN / Alquimia) is NOT installable with pip or conda here: build it separately and put `ats` on PATH
# (or set `ats.executable` in the config).  It is only needed for `arctic-sa run` / `verify`; analysis works from cached outputs.
